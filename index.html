<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Coffe Cal">
    
    <title>Coffe Cal</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%230a0a0a%22/><text y=%22.85em%22 x=%22.1em%22 font-size=%2280%22>☕</text></svg>">

    <!-- Fuente técnica estilo base de datos -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #0f0f0f;
            --orange: #E67E22;
            --cyan: #00E5FF;
            --text-main: #a0a0a0;
            --border-color: #222;
        }

        body { 
            font-family: 'Share Tech Mono', monospace;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            margin: 0;
            overscroll-behavior-y: none; 
        }

        .calculator { 
            background: transparent; 
            max-width: 500px; 
            width: 100%; 
        }

        h1, h2 { 
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
        }

        h1 { 
            color: var(--orange);
            font-size: 2.2em; 
            margin-bottom: 5px; 
            text-align: left;
        }

        .subtitle {
            color: var(--cyan);
            font-size: 0.75em;
            letter-spacing: 1.5px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        h2 { 
            color: var(--orange);
            font-size: 1.4em; 
            margin-bottom: 15px; 
            margin-top: 40px; 
            border-top: 1px solid var(--border-color); 
            padding-top: 25px;
            text-align: left;
        }
        
        .form-group { margin-bottom: 20px; }
        label { 
            display: block; 
            margin-bottom: 8px; 
            color: var(--cyan);
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 1px;
        }
        
        select, input, textarea { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 0; 
            font-size: 16px; 
            box-sizing: border-box; 
            background-color: var(--panel-bg);
            color: white;
            font-family: 'Share Tech Mono', monospace;
            -webkit-appearance: none;
        }
        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: var(--cyan);
        }
        
        .help-text { 
            display: block; 
            margin-top: 6px; 
            font-size: 0.8em; 
            color: #888; 
            font-style: italic;
        }
        
        button { 
            width: 100%; 
            background-color: transparent; 
            color: var(--orange); 
            padding: 14px; 
            border: 1px solid var(--orange); 
            border-radius: 0; 
            font-size: 16px; 
            font-family: 'Share Tech Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer; 
            transition: all 0.2s ease;
            touch-action: manipulation;
        }
        button:hover, button:active { 
            background-color: var(--orange); 
            color: #000;
        }
        
        .result-card { 
            background-color: var(--panel-bg); 
            border-top: 2px solid var(--cyan);
            padding: 20px; 
            margin-top: 30px; 
            display: none; 
        }
        .result-card h3 { 
            margin-top: 0; 
            color: var(--orange); 
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            text-transform: uppercase;
        }
        
        .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .metric-box { 
            background: #0a0a0a; 
            padding: 15px; 
            border: 1px solid var(--border-color);
            text-align: center; 
        }
        .metric-box span { display: block; font-size: 0.8em; color: var(--text-main); margin-bottom: 5px; text-transform: uppercase;}
        .metric-box strong { font-size: 1.5em; color: var(--cyan); }
        
        .info-row { margin: 15px 0 10px 0; font-size: 14px; color: #ccc;}
        .info-row strong { color: var(--cyan); font-weight: normal;}
        
        /* Escala visual de molienda */
        .grind-scale {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            margin-bottom: 25px;
            font-size: 0.8em;
            color: #888;
        }
        .grind-track {
            flex-grow: 1;
            height: 4px;
            background: var(--border-color);
            position: relative;
            border-radius: 2px;
        }
        .grind-indicator {
            position: absolute;
            top: -4px;
            width: 12px;
            height: 12px;
            background: var(--cyan);
            border-radius: 50%;
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 8px var(--cyan);
        }
        
        .steps { margin-top: 20px; padding-left: 0; list-style: none; }
        .steps li { 
            background: #0a0a0a;
            padding: 15px; 
            margin-bottom: 10px; 
            border-left: 2px solid var(--orange);
            color: #ccc;
            font-size: 0.9em;
            line-height: 1.4;
        }
        .steps strong { color: var(--orange); display: inline-block; min-width: 100px; font-weight: normal;}

        /* Cronómetro */
        .timer-container {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
        }
        .timer-display { 
            font-size: 4em; 
            color: var(--orange);
            margin-bottom: 15px; 
            letter-spacing: 2px; 
        }
        .timer-buttons { display: flex; gap: 10px; }
        .timer-buttons button { padding: 10px; font-size: 14px; }
        
        .btn-cyan { color: var(--cyan); border-color: var(--cyan); }
        .btn-cyan:hover, .btn-cyan:active { background-color: var(--cyan); color: #000; }
        .btn-gray { color: #888; border-color: #555; }
        .btn-gray:hover, .btn-gray:active { background-color: #555; color: #fff; }

        /* Bitácora */
        .recipe-list { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
        .recipe-card { 
            background: var(--panel-bg); 
            padding: 15px; 
            border: 1px solid var(--border-color);
            border-left: 2px solid var(--cyan);
            position: relative; 
        }
        .recipe-date { font-size: 0.75em; color: var(--cyan); margin-bottom: 8px; text-transform: uppercase;}
        .recipe-text { white-space: pre-wrap; font-size: 0.9em; color: #ccc; margin-right: 25px; line-height: 1.4; }
        .delete-btn { 
            position: absolute; 
            top: 10px; 
            right: 10px; 
            background: none; 
            color: #666; 
            border: none; 
            font-size: 20px; 
            width: auto;
            padding: 5px;
        }
        .delete-btn:hover { color: #ff3333; background: none; }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>Coffe Cal</h1>
        <div class="subtitle">Calculadora de extracción</div>
        
        <div class="form-group">
            <label for="method">Método de Preparación:</label>
            <select id="method" onchange="updateDefaultRatio()">
                <option value="aeropress">AeroPress</option>
                <option value="v60">Hario V60</option>
                <option value="prensa">Prensa Francesa</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="water">Volumen de Agua (ml):</label>
            <input type="number" id="water" value="250" min="50" step="10">
        </div>

        <div class="form-group">
            <label for="ratio-input">Ratio Objetivo (1:X):</label>
            <input type="number" id="ratio-input" value="15" min="5" max="30" step="0.5">
            <span id="recommended-ratio-text" class="help-text">Recomendado para AeroPress: 1:15</span>
        </div>
        
        <button onclick="calculateBrew()">Generar Receta</button>

        <div id="results" class="result-card">
            <h3>Tu Receta Exacta</h3>
            <div class="metric-grid">
                <div class="metric-box">
                    <span>Café Molido</span>
                    <strong id="coffee-amount"></strong>
                </div>
                <div class="metric-box">
                    <span>Agua Total</span>
                    <strong id="water-amount"></strong>
                </div>
            </div>
            
            <div class="info-row"><strong>RATIO:</strong> <span id="ratio-display"></span></div>
            <div class="info-row"><strong>MOLIENDA:</strong> <span id="grind"></span></div>
            
            <!-- Barra visual de molienda -->
            <div class="grind-scale">
                <span>Fina</span>
                <div class="grind-track">
                    <div class="grind-indicator" id="grind-indicator"></div>
                </div>
                <span>Gruesa</span>
            </div>
            
            <h4 style="margin-top: 25px; margin-bottom: 15px; color: var(--cyan); text-transform: uppercase; font-size: 0.9em;">Paso a Paso:</h4>
            <ul id="timeline" class="steps"></ul>
        </div>

        <div class="timer-container">
            <div class="timer-display" id="timer">00:00</div>
            <div class="timer-buttons">
                <button onclick="startTimer()">Iniciar</button>
                <button class="btn-cyan" onclick="pauseTimer()">Pausar</button>
                <button class="btn-gray" onclick="resetTimer()">Reset</button>
            </div>
        </div>

        <h2>Registro de Datos</h2>
        <div class="form-group">
            <label for="custom-notes">Registra una nueva extracción:</label>
            <textarea id="custom-notes" rows="4" placeholder="Ej: Etiopía Lavado - Ratio 1:16.5 - V60 a 92°C..."></textarea>
            <button class="btn-cyan" style="margin-top: 10px;" onclick="addNote()">Añadir a mi lista</button>
        </div>
        
        <div id="recipe-list-container" class="recipe-list"></div>
    </div>

    <script>
        // Registrar Service Worker para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrado'))
                    .catch(err => console.error('Error registrando Service Worker:', err));
            });
        }

        const recommendedRatios = {
            'aeropress': { ratio: 15, text: 'Recomendado para AeroPress: 1:15' },
            'v60': { ratio: 16, text: 'Recomendado para Hario V60: 1:16' },
            'prensa': { ratio: 15, text: 'Recomendado para Prensa Francesa: 1:15' }
        };

        function updateDefaultRatio() {
            const method = document.getElementById('method').value;
            const rec = recommendedRatios[method];
            document.getElementById('ratio-input').value = rec.ratio;
            document.getElementById('recommended-ratio-text').innerText = rec.text;
        }

        function calculateBrew() {
            const method = document.getElementById('method').value;
            const water = parseFloat(document.getElementById('water').value);
            const ratio = parseFloat(document.getElementById('ratio-input').value);
            
            if (isNaN(water) || water <= 0 || isNaN(ratio) || ratio <= 0) {
                alert("Por favor ingresa valores válidos."); return;
            }

            let grindText, steps, grindPosition;
            const coffee = (water / ratio).toFixed(1);

            if (method === 'aeropress') {
                grindText = "Media-Fina (Textura similar a la sal de mesa)";
                grindPosition = "30%"; // Posición en la barra gráfica
                steps = [
                    `<strong>0:00 - 0:30</strong>Añade ${coffee}g de café. Vierte rápidamente ${water}ml de agua (90°C - 93°C).`,
                    `<strong>0:30 - 0:40</strong>Remueve suavemente 5 veces hasta el fondo.`,
                    `<strong>0:40 - 2:00</strong>Inserta el émbolo y tira ligeramente para crear vacío. Deja reposar.`,
                    `<strong>2:00 - 2:30</strong>Presiona el émbolo de manera constante hasta escuchar el siseo.`
                ];
            } else if (method === 'v60') {
                grindText = "Media (Textura similar a la arena gruesa)";
                grindPosition = "50%";
                const bloomWater = Math.min(coffee * 2.5, water * 0.25).toFixed(0); 
                const pour2 = (water * 0.6).toFixed(0);
                steps = [
                    `<strong>0:00 - 0:45</strong>Vierte ${bloomWater}ml de agua (bloom). Gira suavemente el cono.`,
                    `<strong>0:45 - 1:15</strong>Vierte en espiral desde el centro hacia afuera hasta alcanzar ${pour2}ml.`,
                    `<strong>1:15 - 1:45</strong>Continúa el vertido circular hasta completar ${water}ml.`,
                    `<strong>1:45 - 3:30</strong>Realiza un suave giro final (swirl). Deja drenar por completo.`
                ];
            } else if (method === 'prensa') {
                grindText = "Gruesa (Textura de sal marina o panko)";
                grindPosition = "90%";
                steps = [
                    `<strong>0:00 - 0:30</strong>Vierte ${water}ml de agua sobre los ${coffee}g de café.`,
                    `<strong>0:30 - 4:00</strong>Pon la tapa sin bajar el émbolo. Deja infusionar.`,
                    `<strong>4:00 - 4:15</strong>Rompe la costra superior con una cuchara y limpia la espuma.`,
                    `<strong>4:15 - 9:00</strong>Espera para que los sedimentos caigan al fondo.`,
                    `<strong>9:00</strong>Baja el filtro suavemente solo hasta la superficie y sirve.`
                ];
            }

            document.getElementById('coffee-amount').innerText = coffee + " g";
            document.getElementById('water-amount').innerText = water + " ml";
            document.getElementById('ratio-display').innerText = `1:${ratio}`;
            document.getElementById('grind').innerText = grindText;
            
            // Mover el indicador de la barra gráfica
            document.getElementById('grind-indicator').style.left = grindPosition;

            const timeline = document.getElementById('timeline');
            timeline.innerHTML = "";
            steps.forEach(step => {
                const li = document.createElement('li');
                li.innerHTML = step;
                timeline.appendChild(li);
            });
            document.getElementById('results').style.display = 'block';
        }

        let timerInterval;
        let seconds = 0;

        function updateDisplay() {
            let mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            let secs = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${mins}:${secs}`;
        }

        function startTimer() {
            if (!timerInterval) {
                timerInterval = setInterval(() => {
                    seconds++;
                    updateDisplay();
                }, 1000);
            }
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function resetTimer() {
            pauseTimer();
            seconds = 0;
            updateDisplay();
        }

        let savedRecipes = [];

        function loadNotes() {
            const storedList = localStorage.getItem('coffee_recipes_list');
            if (storedList) {
                savedRecipes = JSON.parse(storedList);
            }
            renderNotes();
        }

        function saveToStorage() {
            localStorage.setItem('coffee_recipes_list', JSON.stringify(savedRecipes));
        }

        function renderNotes() {
            const container = document.getElementById('recipe-list-container');
            container.innerHTML = '';
            
            savedRecipes.forEach((noteObj, index) => {
                const card = document.createElement('div');
                card.className = 'recipe-card';
                
                const dateDiv = document.createElement('div');
                dateDiv.className = 'recipe-date';
                dateDiv.innerText = noteObj.date;

                const textDiv = document.createElement('div');
                textDiv.className = 'recipe-text';
                textDiv.innerText = noteObj.text;
                
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '×';
                delBtn.onclick = () => deleteNote(index);
                
                card.appendChild(dateDiv);
                card.appendChild(textDiv);
                card.appendChild(delBtn);
                container.appendChild(card);
            });
        }

        function addNote() {
            const textArea = document.getElementById('custom-notes');
            const text = textArea.value.trim();
            if(!text) return;
            
            const currentDate = new Date().toLocaleDateString('es-CL', { day: '2-digit', month: 'short', year: 'numeric' });
            savedRecipes.unshift({ text: text, date: currentDate });
            saveToStorage();
            
            textArea.value = '';
            renderNotes();
        }

        function deleteNote(index) {
            if(confirm("¿Eliminar registro?")) {
                savedRecipes.splice(index, 1);
                saveToStorage();
                renderNotes();
            }
        }

        window.onload = function() {
            updateDefaultRatio();
            loadNotes();
        }
    </script>
</body>
</html>
