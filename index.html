<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a" id="meta-theme-color">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Coffe Cal">
    
    <title>Coffe Cal</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%230a0a0a%22/><text y=%22.85em%22 x=%22.1em%22 font-size=%2280%22>☕</text></svg>">

    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        /* VARIABLES DE TEMA (Modo Oscuro por defecto) */
        :root {
            --bg-color: #050505;
            --panel-bg: #0f0f0f;
            --orange: #FFB370;
            --cyan: #00E5FF;
            --text-main: #a0a0a0;
            --text-light: #ccc;
            --border-color: #222;
            --bg-pattern: rgba(255,255,255,0.03);
            --input-text: white;
            --metric-bg: #0a0a0a;
            --h1-glow: 0 0 10px rgba(255, 179, 112, 0.4), 0 0 20px rgba(255, 179, 112, 0.2);
            --tab-text: #666;
            --tab-hover: #aaa;
            --divider: #333;
        }

        /* VARIABLES DE TEMA (Modo Claro/Café) */
        [data-theme="light"] {
            --bg-color: #F5EBE1;
            --panel-bg: #EAE0D5;
            --orange: #8D6E63;
            --cyan: #5D4037;
            --text-main: #4E342E;
            --text-light: #3E2723;
            --border-color: #D7CCC8;
            --bg-pattern: rgba(93, 64, 55, 0.05);
            --input-text: #3E2723;
            --metric-bg: #F5EBE1;
            --h1-glow: none;
            --tab-text: #8D6E63;
            --tab-hover: #5D4037;
            --divider: #D7CCC8;
        }

        html, body {
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body { 
            font-family: 'Share Tech Mono', monospace;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(var(--bg-pattern) 1px, transparent 1px),
                linear-gradient(90deg, var(--bg-pattern) 1px, transparent 1px);
            background-size: 20px 20px;
            background-attachment: fixed; 
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            overscroll-behavior-y: none; 
        }

        .calculator { 
            background: transparent; 
            max-width: 500px; 
            width: 100%; 
        }

        /* Header con botón de tema */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        #theme-btn {
            background: none;
            border: none;
            font-size: 1.8em;
            cursor: pointer;
            padding: 5px;
            width: auto;
            color: var(--orange);
        }

        h1, h2 { 
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
        }

        h1 { 
            color: var(--orange);
            font-size: 2.2em; 
            margin-bottom: 5px; 
            text-align: left;
            text-shadow: var(--h1-glow);
        }

        .subtitle {
            color: var(--tab-text);
            font-size: 0.75em;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--divider);
            text-transform: uppercase;
        }

        /* Pestañas (Tabs) */
        .tabs-container {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 25px;
        }
        .tab {
            padding: 10px 12px;
            color: var(--tab-text);
            text-transform: uppercase;
            font-size: 0.8em;
            letter-spacing: 1px;
            cursor: pointer;
            transition: color 0.2s ease, border-color 0.2s ease;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px; 
            flex-grow: 1;
            text-align: center;
        }
        .tab.active {
            color: var(--orange);
            border-bottom: 2px solid var(--orange);
        }
        .tab:hover:not(.active) { color: var(--tab-hover); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        h2 { 
            color: var(--orange);
            font-size: 1.4em; 
            margin-bottom: 15px; 
            margin-top: 40px; 
            border-top: 1px solid var(--border-color); 
            padding-top: 25px;
            text-align: left;
        }
        
        .form-group { margin-bottom: 20px; }
        label { 
            display: block; 
            margin-bottom: 8px; 
            color: var(--cyan);
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 1px;
        }
        
        select, input, textarea { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 0; 
            font-size: 16px; 
            box-sizing: border-box; 
            background-color: var(--panel-bg);
            color: var(--input-text);
            font-family: 'Share Tech Mono', monospace;
            -webkit-appearance: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: var(--cyan);
        }
        
        .help-text { 
            display: block; 
            margin-top: 6px; 
            font-size: 0.8em; 
            color: var(--tab-text); 
            font-style: italic;
        }
        
        button { 
            width: 100%; 
            background-color: transparent; 
            color: var(--orange); 
            padding: 14px; 
            border: 1px solid var(--orange); 
            border-radius: 0; 
            font-size: 16px; 
            font-family: 'Share Tech Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer; 
            transition: all 0.2s ease;
            touch-action: manipulation;
        }
        button:hover, button:active { 
            background-color: var(--orange); 
            color: var(--panel-bg);
        }
        
        .result-card { 
            background-color: var(--panel-bg); 
            border-top: 2px solid var(--cyan);
            padding: 20px; 
            margin-top: 30px; 
            display: none; 
        }
        .result-card h3 { 
            margin-top: 0; 
            color: var(--orange); 
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            text-transform: uppercase;
        }
        
        .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .metric-box { 
            background: var(--metric-bg); 
            padding: 15px; 
            border: 1px solid var(--border-color);
            text-align: center; 
            transition: background-color 0.3s ease;
        }
        .metric-full { grid-column: span 2; padding: 10px; }
        .metric-box span { display: block; font-size: 0.8em; color: var(--text-main); margin-bottom: 5px; text-transform: uppercase;}
        .metric-box strong { font-size: 1.5em; color: var(--cyan); }
        .metric-full strong { font-size: 1.3em; color: var(--orange); }
        
        .info-row { margin: 15px 0 10px 0; font-size: 14px; color: var(--text-light);}
        .info-row strong { color: var(--cyan); font-weight: normal;}
        
        .grind-scale {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            margin-bottom: 25px;
            font-size: 0.8em;
            color: var(--tab-text);
        }
        .grind-track {
            flex-grow: 1;
            height: 4px;
            background: var(--border-color);
            position: relative;
            border-radius: 2px;
        }
        .grind-indicator {
            position: absolute;
            top: -4px;
            width: 12px;
            height: 12px;
            background: var(--cyan);
            border-radius: 50%;
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 8px var(--cyan);
        }
        
        .steps { margin-top: 20px; padding-left: 0; list-style: none; }
        .steps li { 
            background: var(--metric-bg);
            padding: 15px; 
            margin-bottom: 10px; 
            border-left: 2px solid var(--orange);
            color: var(--text-light);
            font-size: 0.9em;
            line-height: 1.4;
            transition: background-color 0.3s ease;
        }
        .steps strong { color: var(--orange); display: inline-block; min-width: 100px; font-weight: normal;}

        .timer-container {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            transition: background-color 0.3s ease;
        }
        .timer-display { font-size: 4em; color: var(--orange); margin-bottom: 15px; letter-spacing: 2px; }
        .timer-buttons { display: flex; gap: 10px; }
        .timer-buttons button { padding: 10px; font-size: 14px; }
        
        .btn-cyan { color: var(--cyan); border-color: var(--cyan); }
        .btn-cyan:hover, .btn-cyan:active { background-color: var(--cyan); color: var(--panel-bg); }
        .btn-gray { color: var(--tab-text); border-color: var(--tab-text); }
        .btn-gray:hover, .btn-gray:active { background-color: var(--tab-text); color: var(--panel-bg); }

        .io-buttons { display: flex; gap: 10px; margin-top: 10px; }
        .io-buttons button { font-size: 0.8em; padding: 8px; border-color: var(--border-color); color: var(--tab-text);}
        .io-buttons button:hover { background-color: var(--border-color); color: var(--text-main); }

        .recipe-list { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
        .recipe-card { 
            background: var(--panel-bg); 
            padding: 15px; 
            border: 1px solid var(--border-color);
            border-left: 2px solid var(--cyan);
            position: relative; 
            transition: background-color 0.3s ease;
        }
        .recipe-date { font-size: 0.75em; color: var(--cyan); margin-bottom: 8px; text-transform: uppercase;}
        .recipe-text { white-space: pre-wrap; font-size: 0.9em; color: var(--text-light); margin-right: 25px; line-height: 1.4; }
        .delete-btn { 
            position: absolute; 
            top: 10px; 
            right: 10px; 
            background: none; 
            color: var(--tab-text); 
            border: none; 
            font-size: 20px; 
            width: auto;
            padding: 5px;
        }
        .delete-btn:hover { color: #ff3333; background: none; }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="header-top">
            <div>
                <h1>Coffe Cal</h1>
                <div class="subtitle">Brew Intelligence / Recipe Cross-Reference</div>
            </div>
            <button id="theme-btn" onclick="toggleTheme()" title="Cambiar Tema">☀️</button>
        </div>
        
        <!-- Pestañas de Navegación -->
        <div class="tabs-container">
            <div class="tab active" onclick="switchTab('biblioteca')">Biblioteca</div>
            <div class="tab" onclick="switchTab('personalizada')">Personalizar</div>
            <div class="tab" onclick="switchTab('propias')">Propias</div>
        </div>

        <!-- Pestaña: Biblioteca -->
        <div id="tab-biblioteca" class="tab-content active">
            <div class="form-group">
                <label for="method">// Seleccionar método</label>
                <select id="method" onchange="updateDefaultRatio()">
                    <option value="aeropress">AeroPress</option>
                    <option value="v60">Hario V60</option>
                    <option value="prensa_basica">Prensa Francesa (Básica 4 min)</option>
                    <option value="prensa">Prensa Francesa (Hoffmann 9 min)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="water">// Volumen de Agua (ml)</label>
                <input type="number" id="water" value="250" min="50" step="10">
                <span id="recommended-water-text" class="help-text">Rec: 200-250 ml por taza</span>
            </div>
            <div class="form-group">
                <label for="ratio-input">// Ratio Objetivo (1:X)</label>
                <input type="number" id="ratio-input" value="15" min="5" max="30" step="0.5">
                <span id="recommended-ratio-text" class="help-text">Recomendado para AeroPress: 1:15</span>
            </div>
            <button onclick="calculateBrew()">Generar Receta</button>
        </div>

        <!-- Pestaña: Personalizar -->
        <div id="tab-personalizada" class="tab-content">
            <div class="form-group">
                <label for="custom-name">// Nombre del Método / Receta</label>
                <input type="text" id="custom-name" placeholder="Ej: V60 de Tetsu Kasuya">
            </div>
            <div class="form-group">
                <label for="custom-water">// Volumen de Agua (ml)</label>
                <input type="number" id="custom-water" value="300" min="50" step="10">
            </div>
            <div class="form-group">
                <label for="custom-ratio">// Ratio Objetivo (1:X)</label>
                <input type="number" id="custom-ratio" value="15" min="5" max="30" step="0.5">
            </div>
            <div class="form-group">
                <label for="custom-grind">// Molienda a utilizar</label>
                <input type="text" id="custom-grind" placeholder="Ej: Fina, Media-Fina, Gruesa...">
            </div>
            <div class="form-group">
                <label for="custom-steps">// Pasos de vertido (separa cada paso con un "Enter")</label>
                <textarea id="custom-steps" rows="4" placeholder="0:00 - Bloom con 50ml&#10;0:45 - Verter 150ml..."></textarea>
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button onclick="calculateCustomBrew()">Calcular</button>
                <button id="btn-save-custom" class="btn-cyan" onclick="saveOwnRecipe()">Guardar</button>
                <button class="btn-gray" onclick="clearCustomForm()" style="width: auto; padding: 0 15px;" title="Limpiar formulario">↺</button>
            </div>
        </div>

        <!-- Pestaña: Propias -->
        <div id="tab-propias" class="tab-content">
            <div class="io-buttons" style="margin-bottom: 15px;">
                <button onclick="exportOwnRecipes()">Exportar (.txt)</button>
                <button onclick="document.getElementById('import-recipes-file').click()">Importar (.txt)</button>
                <input type="file" id="import-recipes-file" style="display:none" accept=".txt,.md" onchange="importOwnRecipes(event)">
            </div>
            <div id="own-recipes-container" class="recipe-list"></div>
        </div>

        <!-- Resultados Globales -->
        <div id="results" class="result-card">
            <h3 id="result-title">Datos de Extracción</h3>
            <div class="metric-grid">
                <div class="metric-box">
                    <span>Café (g)</span>
                    <strong id="coffee-amount"></strong>
                </div>
                <div class="metric-box">
                    <span>Agua (ml)</span>
                    <strong id="water-amount"></strong>
                </div>
                <div class="metric-box metric-full">
                    <span>Cafeína Est.</span>
                    <strong id="caffeine-amount"></strong>
                </div>
            </div>
            
            <div class="info-row"><strong>RATIO:</strong> <span id="ratio-display"></span></div>
            <div class="info-row"><strong>MOLIENDA:</strong> <span id="grind"></span></div>
            
            <div class="grind-scale" id="grind-scale-container">
                <span>Fina</span>
                <div class="grind-track">
                    <div class="grind-indicator" id="grind-indicator"></div>
                </div>
                <span>Gruesa</span>
            </div>
            
            <h4 style="margin-top: 25px; margin-bottom: 15px; color: var(--cyan); text-transform: uppercase; font-size: 0.9em;">// Secuencia de Vertido</h4>
            <ul id="timeline" class="steps"></ul>
        </div>

        <!-- Cronómetro (Actualizado para no detenerse con pantalla apagada) -->
        <div class="timer-container">
            <div class="timer-display" id="timer">00:00</div>
            <div class="timer-buttons">
                <button onclick="startTimer()">Iniciar</button>
                <button class="btn-cyan" onclick="pauseTimer()">Pausar</button>
                <button class="btn-gray" onclick="resetTimer()">Reset</button>
            </div>
        </div>

        <!-- Bitácora -->
        <h2>Registro de Datos</h2>
        <div class="form-group">
            <label for="custom-notes">// Registra una nueva extracción:</label>
            <textarea id="custom-notes" rows="4" placeholder="Ej: Etiopía Lavado - Ratio 1:16.5 - V60 a 92°C..."></textarea>
            <button class="btn-cyan" style="margin-top: 10px;" onclick="addNote()">Añadir a mi lista</button>
            
            <div class="io-buttons">
                <button onclick="exportNotes()">Exportar (.txt)</button>
                <button onclick="document.getElementById('import-file').click()">Importar (.txt)</button>
                <input type="file" id="import-file" style="display:none" accept=".txt,.md" onchange="importNotes(event)">
            </div>
        </div>
        
        <div id="recipe-list-container" class="recipe-list"></div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); });
        }

        // --- SISTEMA DE TEMA (CLARO/OSCURO) ---
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('theme-btn').innerText = theme === 'dark' ? '☀️' : '🌙';
            
            const metaTheme = document.getElementById('meta-theme-color');
            if(metaTheme) metaTheme.setAttribute('content', theme === 'dark' ? '#0a0a0a' : '#F5EBE1');
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('coffee_theme_pref', newTheme);
            applyTheme(newTheme);
        }

        // --- SISTEMA DE PESTAÑAS ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('results').style.display = 'none';
        }

        // --- DATOS BIBLIOTECA ---
        const recommendedRatios = {
            'aeropress': { ratio: 15, text: 'Recomendado para AeroPress: 1:15', water: 'Rec: 200-250 ml por taza' },
            'v60': { ratio: 16, text: 'Recomendado para Hario V60: 1:16', water: 'Rec: 250-300 ml por taza' },
            'prensa_basica': { ratio: 16, text: 'Recomendado para Prensa Básica: 1:16', water: 'Rec: 250-350 ml por taza' },
            'prensa': { ratio: 15, text: 'Recomendado para Prensa Hoffmann: 1:15', water: 'Rec: 250-350 ml por taza' }
        };

        function updateDefaultRatio() {
            const method = document.getElementById('method').value;
            const rec = recommendedRatios[method];
            document.getElementById('ratio-input').value = rec.ratio;
            document.getElementById('recommended-ratio-text').innerText = rec.text;
            document.getElementById('recommended-water-text').innerText = rec.water;
        }

        function calculateBrew() {
            const method = document.getElementById('method').value;
            const water = parseFloat(document.getElementById('water').value);
            const ratio = parseFloat(document.getElementById('ratio-input').value);
            
            if (isNaN(water) || water <= 0 || isNaN(ratio) || ratio <= 0) { alert("DATOS INVÁLIDOS."); return; }

            const coffee = (water / ratio).toFixed(1);
            let grindText, steps, grindPosition;

            if (method === 'aeropress') {
                grindText = "Media-Fina (Textura similar a la sal de mesa)";
                grindPosition = "30%";
                steps = [
                    `<strong>0:00 - 0:30</strong>Añade ${coffee}g de café. Vierte rápidamente ${water}ml de agua (90°C - 93°C).`,
                    `<strong>0:30 - 0:40</strong>Remueve suavemente 5 veces hasta el fondo.`,
                    `<strong>0:40 - 2:00</strong>Inserta el émbolo y tira ligeramente para crear vacío. Deja reposar.`,
                    `<strong>2:00 - 2:30</strong>Presiona el émbolo de manera constante hasta escuchar el siseo.`
                ];
            } else if (method === 'v60') {
                grindText = "Media (Textura similar a la arena gruesa)";
                grindPosition = "50%";
                const bloomWater = Math.min(coffee * 2.5, water * 0.25).toFixed(0); 
                const pour2 = (water * 0.6).toFixed(0);
                steps = [
                    `<strong>0:00 - 0:45</strong>Vierte ${bloomWater}ml de agua (bloom). Gira suavemente el cono.`,
                    `<strong>0:45 - 1:15</strong>Vierte en espiral desde el centro hacia afuera hasta alcanzar ${pour2}ml.`,
                    `<strong>1:15 - 1:45</strong>Continúa el vertido circular hasta completar ${water}ml.`,
                    `<strong>1:45 - 3:30</strong>Realiza un suave giro final (swirl). Deja drenar por completo.`
                ];
            } else if (method === 'prensa_basica') {
                grindText = "Media (Textura similar a arena, 600 - 800 µm)";
                grindPosition = "70%";
                const bloomWater = (water * 0.25).toFixed(0);
                steps = [
                    `<strong>0:00 - 0:10</strong>Añade ${coffee}g de café y vierte ${bloomWater}ml de agua (96°C) asegurando saturar todo.`,
                    `<strong>0:10 - 0:30</strong>Deja que el café florezca (bloom) por 20 segundos.`,
                    `<strong>0:30 - 0:40</strong>Remueve suavemente con una cuchara y vierte el resto del agua hasta alcanzar ${water}ml.`,
                    `<strong>0:40 - 4:40</strong>Coloca el émbolo encima para mantener el calor (sin presionar) y espera 4 minutos.`,
                    `<strong>4:40 - 4:50</strong>Presiona el émbolo suave y lentamente. Sirve inmediatamente.`
                ];
            } else if (method === 'prensa') {
                grindText = "Gruesa (Textura de sal marina o panko)";
                grindPosition = "90%";
                steps = [
                    `<strong>0:00 - 0:30</strong>Vierte ${water}ml de agua sobre los ${coffee}g de café.`,
                    `<strong>0:30 - 4:00</strong>Pon la tapa sin bajar el émbolo. Deja infusionar.`,
                    `<strong>4:00 - 4:15</strong>Rompe la costra superior con una cuchara y limpia la espuma.`,
                    `<strong>4:15 - 9:00</strong>Espera para que los sedimentos caigan al fondo.`,
                    `<strong>9:00</strong>Baja el filtro suavemente solo hasta la superficie y sirve.`
                ];
            }

            renderResults(
                method === 'prensa_basica' ? 'PRENSA FRANCESA (BÁSICA)' : method.toUpperCase(), 
                coffee, water, ratio, grindText, steps, grindPosition
            );
        }

        function calculateCustomBrew() {
            const name = document.getElementById('custom-name').value || "Método Custom";
            const water = parseFloat(document.getElementById('custom-water').value);
            const ratio = parseFloat(document.getElementById('custom-ratio').value);
            const grind = document.getElementById('custom-grind').value || "No especificada";
            const rawSteps = document.getElementById('custom-steps').value;

            if (isNaN(water) || water <= 0 || isNaN(ratio) || ratio <= 0) { alert("DATOS INVÁLIDOS."); return; }

            const coffee = (water / ratio).toFixed(1);
            let steps = rawSteps.trim() !== "" ? rawSteps.split('\n').filter(s => s.trim() !== "") : ["Sin pasos definidos."];
            
            renderResults(name.toUpperCase(), coffee, water, ratio, grind, steps, null);
        }

        // --- GESTIÓN RECETAS PROPIAS ---
        let editingRecipeIndex = -1;
        let ownRecipes = [];

        function clearCustomForm() {
            document.getElementById('custom-name').value = '';
            document.getElementById('custom-water').value = '300';
            document.getElementById('custom-ratio').value = '15';
            document.getElementById('custom-grind').value = '';
            document.getElementById('custom-steps').value = '';
            editingRecipeIndex = -1;
            document.getElementById('btn-save-custom').innerText = "Guardar";
        }

        function loadOwnRecipes() {
            const stored = localStorage.getItem('coffee_own_recipes');
            if(stored) ownRecipes = JSON.parse(stored);
            renderOwnRecipes();
        }

        function saveOwnRecipe() {
            const name = document.getElementById('custom-name').value || "Método Custom";
            const water = parseFloat(document.getElementById('custom-water').value);
            const ratio = parseFloat(document.getElementById('custom-ratio').value);
            const grind = document.getElementById('custom-grind').value || "No especificada";
            const rawSteps = document.getElementById('custom-steps').value;

            if (isNaN(water) || water <= 0 || isNaN(ratio) || ratio <= 0) { alert("DATOS INVÁLIDOS."); return; }

            if (editingRecipeIndex >= 0) {
                ownRecipes[editingRecipeIndex] = { name, water, ratio, grind, rawSteps };
                alert("Receta actualizada exitosamente.");
            } else {
                ownRecipes.push({ name, water, ratio, grind, rawSteps });
                alert("Receta guardada exitosamente en la pestaña 'PROPIAS'.");
            }
            
            localStorage.setItem('coffee_own_recipes', JSON.stringify(ownRecipes));
            clearCustomForm();
            renderOwnRecipes();
            switchTab('propias');
        }

        function renderOwnRecipes() {
            const container = document.getElementById('own-recipes-container');
            container.innerHTML = '';
            
            if(ownRecipes.length === 0) {
                container.innerHTML = '<p style="color: var(--tab-text); font-style: italic; text-align: center; margin-top: 20px;">No has guardado recetas personalizadas.</p>';
                return;
            }

            ownRecipes.forEach((rec, index) => {
                const card = document.createElement('div');
                card.className = 'recipe-card';
                card.innerHTML = `
                    <div style="color: var(--orange); font-size: 1.1em; font-weight: bold; margin-bottom: 5px; text-transform: uppercase;">${rec.name}</div>
                    <div class="recipe-text">Ratio: 1:${rec.ratio} | Agua: ${rec.water}ml</div>
                    <div style="display: flex; gap: 10px; margin-top: 15px;">
                        <button class="btn-cyan" style="padding: 8px; font-size: 12px;" onclick="calculateOwnBrew(${index})">Calcular</button>
                        <button class="btn-gray" style="padding: 8px; font-size: 12px;" onclick="editOwnRecipe(${index})">Editar</button>
                        <button class="btn-gray" style="padding: 8px; font-size: 12px;" onclick="deleteOwnRecipe(${index})">Eliminar</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function calculateOwnBrew(index) {
            const rec = ownRecipes[index];
            const coffee = (rec.water / rec.ratio).toFixed(1);
            let steps = rec.rawSteps.trim() !== "" ? rec.rawSteps.split('\n').filter(s => s.trim() !== "") : ["Sin pasos definidos."];
            renderResults(rec.name.toUpperCase(), coffee, rec.water, rec.ratio, rec.grind, steps, null);
        }

        function editOwnRecipe(index) {
            const rec = ownRecipes[index];
            document.getElementById('custom-name').value = rec.name;
            document.getElementById('custom-water').value = rec.water;
            document.getElementById('custom-ratio').value = rec.ratio;
            document.getElementById('custom-grind').value = rec.grind;
            document.getElementById('custom-steps').value = rec.rawSteps;
            
            editingRecipeIndex = index;
            document.getElementById('btn-save-custom').innerText = "Actualizar";
            switchTab('personalizada');
        }

        function deleteOwnRecipe(index) {
            if(confirm("¿Eliminar esta receta?")) {
                ownRecipes.splice(index, 1);
                localStorage.setItem('coffee_own_recipes', JSON.stringify(ownRecipes));
                renderOwnRecipes();
            }
        }
        
        function exportOwnRecipes() {
            if(ownRecipes.length === 0) { alert("No hay recetas para exportar."); return; }
            let mdContent = "# Recetas Propias - Coffe Cal\n\n";
            ownRecipes.forEach(rec => {
                mdContent += `## ${rec.name}\nRatio: ${rec.ratio}\nAgua: ${rec.water}\nMolienda: ${rec.grind}\nPasos:\n${rec.rawSteps}\n\n---\n\n`;
            });
            const blob = new Blob([mdContent], {type: "text/plain;charset=utf-8"});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "coffe_cal_recetas_propias.txt";
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function importOwnRecipes(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const blocks = e.target.result.split('---');
                let importedCount = 0;
                blocks.forEach(block => {
                    const lines = block.trim().split('\n');
                    let name = "", ratio = 15, water = 250, grind = "", rawStepsArr = [], isSteps = false;
                    lines.forEach(l => {
                        const line = l.trim();
                        if (line.startsWith('## ')) name = line.substring(3).trim();
                        else if (line.startsWith('Ratio:')) ratio = parseFloat(line.substring(6).trim());
                        else if (line.startsWith('Agua:')) water = parseFloat(line.substring(5).trim());
                        else if (line.startsWith('Molienda:')) grind = line.substring(9).trim();
                        else if (line.startsWith('Pasos:')) isSteps = true;
                        else if (isSteps && line !== "") rawStepsArr.push(line);
                    });
                    if(name && !isNaN(ratio) && !isNaN(water)) {
                        ownRecipes.push({ name, water, ratio, grind, rawSteps: rawStepsArr.join('\n') });
                        importedCount++;
                    }
                });
                if(importedCount > 0) {
                    localStorage.setItem('coffee_own_recipes', JSON.stringify(ownRecipes));
                    renderOwnRecipes();
                    alert(`Se importaron ${importedCount} recetas.`);
                } else alert("Formato no válido.");
            };
            reader.readAsText(file);
            event.target.value = ''; 
        }

        function renderResults(title, coffee, water, ratio, grind, stepsArray, grindPosition) {
            document.getElementById('result-title').innerText = `Datos: ${title}`;
            document.getElementById('coffee-amount').innerText = coffee;
            document.getElementById('water-amount').innerText = water;
            document.getElementById('ratio-display').innerText = `1:${ratio}`;
            document.getElementById('grind').innerText = grind;
            
            const caffeine = (coffee * 10).toFixed(0);
            document.getElementById('caffeine-amount').innerText = `~${caffeine} mg`;

            const scaleContainer = document.getElementById('grind-scale-container');
            if (grindPosition) {
                scaleContainer.style.display = 'flex';
                document.getElementById('grind-indicator').style.left = grindPosition;
            } else scaleContainer.style.display = 'none'; 

            const timeline = document.getElementById('timeline');
            timeline.innerHTML = "";
            stepsArray.forEach(step => {
                const li = document.createElement('li');
                li.innerHTML = step;
                timeline.appendChild(li);
            });
            document.getElementById('results').style.display = 'block';
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
        }

        // --- CRONÓMETRO AVANZADO (Delta Time + WakeLock) ---
        let timerInterval;
        let timerSeconds = 0;
        let startTime = 0;
        let isRunning = false;
        let wakeLock = null;

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) { console.log(`Wake Lock error: ${err.message}`); }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && isRunning) {
                requestWakeLock(); // Re-solicita el bloqueo de pantalla al volver a la app
            }
        });

        function updateDisplay() {
            let mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
            let secs = (timerSeconds % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${mins}:${secs}`;
        }

        function startTimer() { 
            if (!isRunning) { 
                isRunning = true;
                startTime = Date.now() - (timerSeconds * 1000); // Fija el tiempo de origen real
                timerInterval = setInterval(() => { 
                    // Calcula los segundos en base a la hora del sistema, no iteraciones del navegador
                    timerSeconds = Math.floor((Date.now() - startTime) / 1000); 
                    updateDisplay(); 
                }, 250); 
                requestWakeLock();
            } 
        }

        function pauseTimer() { 
            if(isRunning) {
                clearInterval(timerInterval); 
                isRunning = false;
                releaseWakeLock();
            }
        }

        function resetTimer() { pauseTimer(); timerSeconds = 0; updateDisplay(); }

        // --- BITÁCORA ---
        let savedLogs = [];

        function loadNotes() {
            const storedList = localStorage.getItem('coffee_recipes_list');
            if (storedList) savedLogs = JSON.parse(storedList);
            renderNotes();
        }

        function saveToStorage() { localStorage.setItem('coffee_recipes_list', JSON.stringify(savedLogs)); }

        function renderNotes() {
            const container = document.getElementById('recipe-list-container');
            container.innerHTML = '';
            savedLogs.forEach((noteObj, index) => {
                const card = document.createElement('div');
                card.className = 'recipe-card';
                card.innerHTML = `<div class="recipe-date">${noteObj.date}</div><div class="recipe-text">${noteObj.text}</div><button class="delete-btn" onclick="deleteNote(${index})">×</button>`;
                container.appendChild(card);
            });
        }

        function addNote() {
            const textArea = document.getElementById('custom-notes');
            const text = textArea.value.trim();
            if(!text) return;
            const currentDate = new Date().toLocaleDateString('es-CL', { day: '2-digit', month: 'short', year: 'numeric' });
            savedLogs.unshift({ text, date: currentDate });
            saveToStorage();
            textArea.value = '';
            renderNotes();
        }

        function deleteNote(index) {
            if(confirm("¿Eliminar registro?")) { savedLogs.splice(index, 1); saveToStorage(); renderNotes(); }
        }

        function exportNotes() {
            if(savedLogs.length === 0) { alert("No hay registros para exportar."); return; }
            let mdContent = "# Bitácora de Extracción - Coffe Cal\n\n";
            savedLogs.forEach(r => { mdContent += `### ${r.date}\n${r.text}\n\n---\n\n`; });
            const blob = new Blob([mdContent], {type: "text/plain;charset=utf-8"});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "coffe_cal_bitacora.txt";
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function importNotes(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const blocks = e.target.result.split('---');
                let importedCount = 0;
                blocks.forEach(block => {
                    const lines = block.trim().split('\n');
                    let date = "", content = [];
                    lines.forEach(l => {
                        if(l.startsWith('### ')) date = l.substring(4).trim();
                        else if(l.trim() !== "" && !l.startsWith('# Bitácora')) content.push(l);
                    });
                    if(date && content.length > 0) {
                        savedLogs.push({ date, text: content.join('\n') });
                        importedCount++;
                    }
                });
                if(importedCount > 0) { saveToStorage(); renderNotes(); alert(`Se importaron ${importedCount} registros.`); } 
                else alert("Formato no válido.");
            };
            reader.readAsText(file);
            event.target.value = ''; 
        }

        window.onload = function() {
            const savedTheme = localStorage.getItem('coffee_theme_pref') || 'dark';
            applyTheme(savedTheme);
            updateDefaultRatio();
            loadNotes();
            loadOwnRecipes();
        }
    </script>
</body>
</html>
